<!-- Admin Panel Modal ke andar product addition form -->
<div class="admin-form-group" style="margin: 15px 0;">
    <h3>Add New Product (Multiple Photos & Video)</h3>
    <input type="text" id="adminProdName" placeholder="Product Name" class="input-box">
    <input type="number" id="adminProdPrice" placeholder="Selling Price (₹)" class="input-box">
    <input type="number" id="adminProdMrp" placeholder="MRP Price (₹)" class="input-box">
    <select id="adminProdCat" class="input-box" style="padding:10px;">
        <option value="Fashion">Fashion</option>
        <option value="Electronics">Electronics</option>
        <option value="Home">Home & Kitchen</option>
    </select>
    <input type="text" id="adminProdImg" placeholder="Main Image URL (Thumbnail)" class="input-box">
    <input type="text" id="adminProdImages" placeholder="Extra Image URLs (Comma separated: url1, url2, url3)" class="input-box">
    <input type="text" id="adminProdVideo" placeholder="Video URL (YouTube / MP4 link)" class="input-box">
    <button onclick="addNewProduct()" class="btn-primary">Add Product with Media</button>
</div>
