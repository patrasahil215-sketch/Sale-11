<!-- Yeh code index.html mein add karein -->
<!-- Product Details Modal (ise </body> ke thik upar rakhein) -->
<div id="detailsModal" class="modal" style="display:none;">
    <div class="modal-content">
        <span class="close" onclick="closeDetailsModal()">&times;</span>
        <img id="detailImg" src="" style="width:100%; height:200px; object-fit:cover; border-radius:8px;">
        <h2 id="detailName"></h2>
        <p class="price">Price: ₹<span id="detailPrice"></span></p>
        <p id="detailCategory" style="color:#777;"></p>
        <button class="btn-primary" onclick="addToCartFromDetails()">Add to Cart</button>
        <h3 style="margin-top:15px;">Similar Products</h3>
        <div id="similarProducts" style="display:flex; gap:10px; margin-top:10px; overflow-x:auto;"></div>
    </div>
</div>
