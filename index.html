<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sale 11 - Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Sale 11</h1>
  <div class="actions">
    <button onclick="openAdmin()" class="admin-btn">Admin</button>
    <button onclick="openCart()">Cart (<span id="cartCount">0</span>)</button>
  </div>
</header>

<main>
  <section id="products" class="grid"></section>
</main>

<div id="detailModal" class="modal hidden">
  <div class="modal-content">
    <img id="detailImg" src="" alt="" class="detail-img">
    <h2 id="detailName"></h2>
    <p id="detailDesc"></p>
    <p><b>Price: ₹<span id="detailPrice"></span></b></p>
    <button onclick="addToCartFromDetail()" class="primary">Add to Cart</button>
    <button onclick="closeDetail()">Close</button>
  </div>
</div>

<div id="adminModal" class="modal hidden">
  <div class="modal-content">
    <h2>Add Product (Meesho Style)</h2>
    <input type="text" id="prodName" placeholder="Product Name">
    <textarea id="prodDesc" placeholder="Full Product Description"></textarea>
    <input type="number" id="prodPrice" placeholder="Price (₹)">
    <input type="number" id="prodMrp" placeholder="MRP (₹)">
    <input type="text" id="prodImg" placeholder="Image URL">
    <button onclick="addNewProduct()" class="primary">Add Product</button>
    <button onclick="closeAdmin()">Close</button>
  </div>
</div>

<div id="cartModal" class="modal hidden">
  <div class="modal-content">
    <h2>Your Cart</h2>
    <div id="cartItems"></div>
    <h3>Total: ₹<span id="cartTotal">0</span></h3>
    <button onclick="closeCart()">Close</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
