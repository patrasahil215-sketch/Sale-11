<!-- Refer & Earn Modal (ise </body> ke thik upar add karein) -->
<div id="referModal" class="modal" style="display:none;">

        <span class="close" onclick="closeReferModal()">&times;</span>
        <h2>Refer & Earn ₹50 🎁</h2>
        <p style="font-size:13px; color:var(--text-color); margin: 10px 0;">Share your unique referral link with friends. When they visit and shop, you both get ₹50 cashback!</p>
        <div style="background:var(--bg-color); padding:10px; border:1px dashed var(--border-color); border-radius:4px; margin: 15px 0; font-weight:bold; word-break:break-all;" id="referralLinkText">
            https://sale11store.com/?ref=user
        </div>
        <button onclick="shareReferralLink()" class="btn-primary">Share on WhatsApp</button>
    </div>
</div>
