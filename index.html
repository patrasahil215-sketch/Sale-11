<!-- Search Bar area in index.html -->
<div class="search-container" style="position: relative; width: 40%;">
    <div class="search-bar" style="width: 100%;">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search products..." onkeyup="showSearchSuggestions()" onfocus="showSearchSuggestions()">
    </div>
    <div id="searchSuggestionsBox" class="suggestions-dropdown" style="display:none;"></div>
</div>
